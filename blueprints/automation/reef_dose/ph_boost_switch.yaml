blueprint:
  name: Reef Dose - pH-Boost Part 1 Variant Switch
  description: >-
    Implements requirements.md Section 6: once an hour, at :50 past, decides
    which Part 1 variant (no-boost or pH-boost) should dose the *next* hour,
    and enables it while disabling the other - never both at once.

    Talks directly to HA's native ESPHome integration's switch entities
    (switch.turn_on/switch.turn_off) - NOT reef-dose-service's
    reef_dose.update_schedule. Changed 2026-10-05 after reef-dose-service's
    Node/esphome-client write path proved unreliable in production (a stuck
    connection that silently broke every write until a manual restart,
    confirmed live, multiple root-cause attempts over one day didn't fully
    resolve it). The native integration uses aioesphomeapi (Python, the
    same client Home Assistant's ESPHome support is built on) and was 100%
    reliable in every side-by-side test run against it that day. Only ever
    toggles schedule_enabled - it does NOT push schedule slot values (see
    the git history for why that was dropped as unnecessary overhead
    separately, 2026-10-05): the two variants are kept at identical slot
    values by editing the group's schedule directly in reef-dose-service
    (reef_dose.update_group_schedule / sync_group_member / sync_group)
    whenever that actually changes, which is rare and manual.

    Gated by a manual "pH Boost Enabled" input_boolean you create yourself
    (Settings -> Devices & Services -> Helpers -> Toggle) - this is the
    season switch, not a pH fallback: OFF means boost is out of season
    entirely, so the automation forces no-boost every run without even
    looking at pH. ON means boost season is active, so the automation
    examines live pH and time of day to decide - pH > 8.3 -> no-boost,
    pH < 8.3 -> boost, additionally after 20:00 *and* pH < 8.4 -> boost
    (overrides the above). If the pH sensor is unavailable or hasn't
    updated recently while boost is in season, defaults to boost (the
    safer assumption during the season this channel exists for) until a
    fresh reading arrives.
  domain: automation
  input:
    apex_ph_entity:
      name: Apex pH Sensor
      description: The Apex's real-time pH sensor entity.
      default: sensor.apex_ph
      selector:
        entity:
          domain: sensor
    no_boost_switch_entity:
      name: No-Boost Schedule Enabled Switch
      description: >-
        The native ESPHome "Schedule Enabled" switch entity for Part 1
        WITHOUT pH boost (Settings -> Devices & Services -> ESPHome ->
        Reef Dose -> find the pump's "Schedule Enabled" control -> gear
        icon -> Entity ID).
      selector:
        entity:
          domain: switch
    boost_switch_entity:
      name: pH-Boost Schedule Enabled Switch
      description: >-
        The native ESPHome "Schedule Enabled" switch entity for Part 1
        WITH pH boost.
      selector:
        entity:
          domain: switch
    ph_boost_enabled_helper:
      name: pH Boost Enabled
      description: >-
        An input_boolean you create yourself first (Settings -> Devices &
        Services -> Helpers -> + Add Helper -> Toggle). ON = pH-boost
        season is active - the hourly decision examines live pH and time
        of day. OFF = out of season - always no-boost, pH is not even
        checked.
      selector:
        entity:
          domain: input_boolean
    stale_after_minutes:
      name: Stale After (minutes)
      description: >-
        If the pH sensor hasn't updated in this many minutes while boost
        is in season, treat it as unavailable and default to boost instead
        until a fresh reading arrives.
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes

trigger:
  - platform: time_pattern
    minutes: 50

condition: []

variables:
  ph_entity: !input apex_ph_entity
  stale_after_minutes: !input stale_after_minutes
  ph_boost_helper: !input ph_boost_enabled_helper
  no_boost_switch: !input no_boost_switch_entity
  boost_switch: !input boost_switch_entity
  ph_available: "{{ states(ph_entity) not in ['unknown', 'unavailable', none] }}"
  ph_age_minutes: >-
    {{ ((now() - states[ph_entity].last_updated).total_seconds() / 60)
       if ph_available else 999999 }}
  ph_fresh: "{{ ph_available and ph_age_minutes < stale_after_minutes }}"
  ph_value: "{{ states(ph_entity) | float(8.3) }}"
  boost_in_season: "{{ is_state(ph_boost_helper, 'on') }}"
  # Out of season -> always no-boost, pH not even considered. In season ->
  # pH>8.3 -> no-boost, pH<8.3 -> boost, additionally after 20:00 and
  # pH<8.4 -> boost (overrides); if pH is stale while in season, default
  # to boost rather than no-boost - requirements.md Section 6.
  decision_boost: >-
    {{ false if not boost_in_season else
       (((ph_value < 8.3) or (now().hour >= 20 and ph_value < 8.4))
        if ph_fresh else true) }}

action:
  # Disable the losing variant BEFORE enabling the winner. This ordering
  # means if anything in here fails partway, the worst case is both
  # variants disabled (no dose this hour) rather than both enabled
  # (double dose) - fail safe, not fail dangerous. continue_on_error
  # kept even though the native switch services have proven reliable in
  # testing - cheap insurance, not evidence they're expected to fail.
  - choose:
      - conditions:
          - "{{ decision_boost }}"
        sequence:
          - service: switch.turn_off
            continue_on_error: true
            target:
              entity_id: "{{ no_boost_switch }}"
          - service: switch.turn_on
            continue_on_error: true
            target:
              entity_id: "{{ boost_switch }}"
    default:
      - service: switch.turn_off
        continue_on_error: true
        target:
          entity_id: "{{ boost_switch }}"
      - service: switch.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ no_boost_switch }}"
  # Native switch.turn_on/turn_off don't accept arbitrary context data
  # the way reef_dose.update_schedule did - this replaces that audit
  # trail (pH reading, freshness, season, decision) with a logbook
  # entry, so "why did it pick boost this time" stays visible in HA's
  # own Logbook against the switch that changed.
  - service: logbook.log
    continue_on_error: true
    data:
      name: pH-Boost decision
      message: >-
        {{ 'boost' if decision_boost else 'no_boost' }} - pH={{ ph_value }},
        fresh={{ ph_fresh }}, season={{ boost_in_season }}
      entity_id: "{{ boost_switch if decision_boost else no_boost_switch }}"

mode: single
