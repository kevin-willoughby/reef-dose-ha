get_schedule:
  name: Get Schedule
  description: >-
    Reads one pump's full 24-hour schedule (scheduleEnabled, all 24 slots,
    splitDoseEnabled). Response-only - meant for the reef-dose-card custom
    Lovelace card, not automations.
  fields:
    pump_id:
      required: true
      example: "1"
      selector:
        text:

get_reservoir:
  name: Get Reservoir
  description: >-
    Reads one pump's reservoir state (remainingMl, fullMl, dosedTodayMl,
    daysRemaining). Response-only - meant for the reef-dose-card custom
    Lovelace card, not automations.
  fields:
    pump_id:
      required: true
      example: "1"
      selector:
        text:

refill_reservoir:
  name: Refill Reservoir
  description: >-
    Writes a new full-volume (full_ml) then resets the reservoir-remaining
    sensor to it - full_ml is required, recording what the reservoir was
    actually just filled to rather than re-asserting a stale configured
    size. Meant for the reef-dose-card custom Lovelace card's Refill
    button, but usable from automations too.
  fields:
    pump_id:
      required: true
      example: "1"
      selector:
        text:
    full_ml:
      required: true
      example: 500
      selector:
        number:
          min: 0
          max: 20000
          unit_of_measurement: mL

start_calibration:
  name: Start Calibration
  description: >-
    Runs a pump briefly for calibration and returns the sessionId that must
    be passed to apply_calibration next - a stale or mismatched sessionId is
    silently ignored by the firmware, so the card threads this value through
    its calibration screens rather than inventing its own. Meant for the
    reef-dose-card custom Lovelace card's Calibrate button.
  fields:
    pump_id:
      required: true
      example: "1"
      selector:
        text:

apply_calibration:
  name: Apply Calibration
  description: >-
    Finishes a calibration run started by start_calibration, recording how
    many mL the pump actually dispensed (measured_ml) for the given
    session_id. Meant for the reef-dose-card custom Lovelace card's
    calibration flow.
  fields:
    pump_id:
      required: true
      example: "1"
      selector:
        text:
    session_id:
      required: true
      example: 42
      selector:
        number:
          min: 0
    measured_ml:
      required: true
      example: 12.5
      selector:
        number:
          min: 0.01
          max: 2000
          step: 0.01
          unit_of_measurement: mL

update_schedule:
  name: Update Schedule
  description: >-
    Partial update to one pump's schedule - only the fields given are
    changed. slots is a map of hour ("00"-"23") to ml (0-50, 2 decimal
    places); 0 removes that slot.
  fields:
    pump_id:
      required: true
      example: "1"
      selector:
        text:
    schedule_enabled:
      selector:
        boolean:
    split_dose_enabled:
      selector:
        boolean:
    slots:
      example: '{"00": 1.29, "14": 0}'
      selector:
        object:
    context:
      description: >-
        Optional free-form explanation for WHY this write is happening, e.g.
        {"ph": 8.18, "boostInSeason": true, "decision": "boost"} - stored
        verbatim in reef-dose-service's audit log alongside the before/after
        values, never interpreted by the service itself. Lets an automation
        (like the pH-boost blueprint) record the live reading that drove its
        decision, not just the resulting on/off state.
      example: '{"ph": 8.18, "decision": "boost"}'
      selector:
        object:

auto_divide_schedule:
  name: Auto-Divide Schedule
  description: >-
    Evenly splits a daily total ml across all 24 hourly slots and writes it
    straight to the device - the schedule's starting point, not its end
    state.
  fields:
    pump_id:
      required: true
      example: "1"
      selector:
        text:
    daily_total_ml:
      required: true
      selector:
        number:
          min: 0
          max: 1200
          step: 0.01
          unit_of_measurement: mL

get_groups:
  name: Get Groups
  description: Lists every scaling group. Response-only.

create_group:
  name: Create Group
  description: Creates a new scaling group.
  fields:
    group_id:
      required: true
      example: complete-parts
      selector:
        text:
    name:
      required: true
      example: Complete Parts
      selector:
        text:
    pump_ids:
      required: true
      example: '["1", "4"]'
      selector:
        object:
    scale_percent:
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: "%"
    auto_sync:
      description: >-
        true (default): push to every member immediately on any template
        change. false: only update the stored template - nothing reaches a
        device until sync_group_member/sync_group is called explicitly. Use
        false for a group with mutually-exclusive members (e.g. two Part 1
        variants, only one of which should ever be enabled at a time).
      selector:
        boolean:

update_group:
  name: Update Group
  description: >-
    Partial update to a scaling group - only the fields given are changed.
    Changing scale_percent rescales every member pump's full schedule.
  fields:
    group_id:
      required: true
      example: complete-parts
      selector:
        text:
    name:
      selector:
        text:
    pump_ids:
      example: '["1", "4"]'
      selector:
        object:
    scale_percent:
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: "%"
    auto_sync:
      selector:
        boolean:

delete_group:
  name: Delete Group
  description: >-
    Deletes a scaling group. Member pumps keep dosing whatever their last
    effective schedule was - this just stops anything from rescaling them
    going forward.
  fields:
    group_id:
      required: true
      example: complete-parts
      selector:
        text:

apply_pump_adjustment:
  name: Apply Pump Adjustment
  description: >-
    "Manual Overall Adjustment" for a single, ungrouped pump - a percentage
    that compounds onto whatever the pump's schedule is currently at (-10
    means 10% less than now, not an absolute target). Rejected if the pump
    is currently in a group - adjust the group instead.
  fields:
    pump_id:
      required: true
      example: "1"
      selector:
        text:
    delta_percent:
      required: true
      selector:
        number:
          min: -100
          max: 900
          unit_of_measurement: "%"

get_group_schedule:
  name: Get Group Schedule
  description: >-
    Reads a scaling group's own 24-hour schedule (the exact values pushed
    identically to every current member). Response-only.
  fields:
    group_id:
      required: true
      example: complete-parts
      selector:
        text:

update_group_schedule:
  name: Update Group Schedule
  description: >-
    Partial edit to a scaling group's own schedule - writes the given hours
    identically to every current member. slots is a map of hour ("00"-"23")
    to ml (0-50, 2 decimal places); 0 removes that slot.
  fields:
    group_id:
      required: true
      example: complete-parts
      selector:
        text:
    slots:
      required: true
      example: '{"00": 1.29, "14": 0}'
      selector:
        object:

auto_divide_group_schedule:
  name: Auto-Divide Group Schedule
  description: >-
    Evenly splits a daily total ml across all 24 hourly slots and pushes it
    identically to every current member - the group schedule's starting
    point, not its end state.
  fields:
    group_id:
      required: true
      example: complete-parts
      selector:
        text:
    daily_total_ml:
      required: true
      selector:
        number:
          min: 0
          max: 1200
          step: 0.01
          unit_of_measurement: mL

sync_group_member:
  name: Sync Group Member
  description: >-
    Pushes a group's current template to just one member pump - the
    explicit action an autoSync: false group needs (e.g. an automation
    deciding which of several mutually-exclusive variants should actually
    be active right now).
  fields:
    group_id:
      required: true
      example: complete-parts
      selector:
        text:
    pump_id:
      required: true
      example: "1"
      selector:
        text:

sync_group:
  name: Sync Group
  description: Pushes a group's current template to every current member.
  fields:
    group_id:
      required: true
      example: complete-parts
      selector:
        text:

get_audit_log:
  name: Get Audit Log
  description: >-
    Reads recent pump/group write history (newest first) from
    reef-dose-service's audit log - what changed, when, and any context the
    caller attached (e.g. the pH-boost blueprint's live pH reading and
    decision). Response-only; call from Developer Tools -> Actions to view it,
    or from a future dashboard card.
  fields:
    pump_id:
      description: Only entries for this physical pump (1-6). Omit for every pump.
      example: "1"
      selector:
        text:
    group_id:
      description: Only entries for this scaling group. Omit for every group.
      example: Reef Zelements
      selector:
        text:
    limit:
      description: Maximum number of entries to return (newest first). Default 200.
      example: 20
      selector:
        number:
          min: 1
          max: 1000
